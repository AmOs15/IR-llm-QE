[project]
name = "ir-llm-qe"
version = "0.2.0"
description = "LLM-based query expansion for BM25 retrieval on MIRACL Japanese"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserini>=2.4.0",
    "ir-datasets>=0.6.3",
    "tqdm>=4.67.0",
    "pandas>=2.2",      # 04_analyze_*.py で使用
    "openai>=2.12.0",   # ollama バックエンド（OpenAI 互換エンドポイント）
]

[project.optional-dependencies]
# transformers バックエンド（RTX / CUDA）で MXFP4 を使うための一式。
# torch / transformers 自体は pyserini の依存として常に入るので書かない。
# triton は macOS arm64 wheel が無いため Linux マーカーを付ける。
cuda = [
    "accelerate>=1.16.0",
    "kernels>=0.10.0",
    "triton>=3.4.0; platform_system == 'Linux'",
]

[tool.uv]
package = false         # src/ はスクリプト集。ビルドしない
